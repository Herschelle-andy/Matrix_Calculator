<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Scientific Calculator — Turquoise</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ── OUTSIDE: vivid matrix green ── */
    --green-bright: #00ff41;
    --green-mid:    #00cc33;
    --green-dim:    #007a20;
    --green-glow:   #39ff14;

    /* ── INSIDE: blazing turquoise ── */
    --tq:           #00F5C8;   /* core turquoise — very bright */
    --tq-hot:       #00FFDA;   /* hottest glow highlight */
    --tq-mid:       #00C9A7;   /* mid tone */
    --tq-dim:       #00A085;   /* subdued / labels */
    --tq-deep:      #003D35;   /* darkest tint for button bases */

    /* ── BACKGROUNDS ── */
    --bg:           #010C0A;
    --glass:        rgba(0, 22, 26, 0.80);
    --display-bg:   rgba(0, 8, 10, 0.97);
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    position: relative;
  }

  /* ══════════════════════════════════════════
     MATRIX RAIN
  ══════════════════════════════════════════ */
  #matrix-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ══════════════════════════════════════════
     WRAPPER & TITLE
  ══════════════════════════════════════════ */
  .calc-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .calc-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 0.42em;
    color: var(--green-bright);
    text-shadow:
      0 0 8px  var(--green-glow),
      0 0 28px rgba(0,255,65,0.65),
      0 0 70px rgba(0,255,65,0.28);
    text-transform: uppercase;
  }

  .footer-text {
    font-size: 0.56rem;
    color: var(--green-mid);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(0,255,65,0.45);
  }

  /* ══════════════════════════════════════════
     CALCULATOR SHELL — marble white interior
  ══════════════════════════════════════════ */
  .calculator {
    /* ── Marble white base with subtle warm ivory tone ── */
    background:
      /* top-left diagonal vein — soft grey */
      repeating-linear-gradient(
        128deg,
        transparent 0px,
        transparent 38px,
        rgba(180,200,195,0.10) 38px,
        rgba(180,200,195,0.10) 39px,
        transparent 39px,
        transparent 80px,
        rgba(160,185,182,0.07) 80px,
        rgba(160,185,182,0.07) 81px,
        transparent 81px,
        transparent 140px
      ),
      /* faint cross-vein — warm grey */
      repeating-linear-gradient(
        42deg,
        transparent 0px,
        transparent 55px,
        rgba(190,195,192,0.08) 55px,
        rgba(190,195,192,0.08) 56px,
        transparent 56px,
        transparent 110px
      ),
      /* turquoise mineral tint — very subtle */
      radial-gradient(ellipse at 30% 20%, rgba(0,245,200,0.055) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(0,220,190,0.04)  0%, transparent 50%),
      /* warm white marble base */
      linear-gradient(160deg,
        #f8fffe 0%,
        #f2fbf8 30%,
        #eef9f5 55%,
        #f4fdfb 80%,
        #f9fffe 100%);
    border: 2px solid rgba(0,245,200,0.65);
    border-radius: 20px;
    padding: 20px 18px 22px;
    width: 424px;
    position: relative;
    box-shadow:
      /* inner marble depth — top light */
      inset 0  2px  8px rgba(255,255,255,0.95),
      inset 0 -2px  6px rgba(0,200,170,0.08),
      inset  2px 0  6px rgba(255,255,255,0.60),
      inset -2px 0  6px rgba(0,220,190,0.06),
      /* turquoise outer glow */
      0 0 0 1px       rgba(0,245,200,0.25),
      0 0 28px        rgba(0,245,200,0.38),
      0 0 75px        rgba(0,200,170,0.20),
      0 0 140px       rgba(0,0,0,0.88);
    animation: pulse-ring 4s ease-in-out infinite;
  }

  /* animated shimmer sweep across marble top */
  .calculator::before {
    content: '';
    position: absolute;
    top: 0; left: 8%; right: 8%;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(0,255,218,0.85) 38%,
      rgba(255,255,255,0.95) 50%,
      rgba(0,255,218,0.85) 62%,
      transparent 100%);
    animation: shimmer-top 3.5s ease-in-out infinite;
    filter: blur(0.6px);
  }

  @keyframes shimmer-top {
    0%,100% { opacity: 0.55; left: 10%; right: 50%; }
    50%     { opacity: 1;    left: 50%; right: 10%; }
  }

  /* scan-line overlay */
  .calculator::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.022) 2px,
      rgba(0,0,0,0.022) 4px
    );
    pointer-events: none;
    border-radius: 20px;
    z-index: 1;
  }

  /* ══════════════════════════════════════════
     DISPLAY
  ══════════════════════════════════════════ */
  .display {
    background: var(--display-bg);
    border: 1.5px solid rgba(0,245,200,0.50);
    border-radius: 12px;
    padding: 14px 16px 10px;
    margin-bottom: 12px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 0 50px rgba(0,245,200,0.07),
      inset 0 0 12px rgba(0,245,200,0.04),
      /* display lifts off the marble with a soft shadow */
      0 4px 18px rgba(0,0,0,0.28),
      0 1px  4px rgba(0,0,0,0.18),
      0 0   20px rgba(0,245,200,0.15);
  }

  /* glowing top bar */
  .display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent,
      rgba(0,245,200,0.4) 20%,
      var(--tq-hot) 50%,
      rgba(0,245,200,0.4) 80%,
      transparent);
    filter: blur(0.5px);
  }

  /* bottom reflection */
  .display::after {
    content: '';
    position: absolute;
    bottom: 0; left: 5%; right: 5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,245,200,0.2), transparent);
  }

  .display-mode {
    font-size: 0.62rem;
    font-weight: bold;
    color: var(--tq-dim);
    letter-spacing: 0.22em;
    position: absolute;
    top: 9px; left: 13px;
    text-transform: uppercase;
    text-shadow: 0 0 6px rgba(0,245,200,0.4);
  }

  .display-shift {
    font-size: 0.62rem;
    font-weight: bold;
    color: var(--tq-dim);
    letter-spacing: 0.22em;
    position: absolute;
    top: 9px; right: 13px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .display-shift.active {
    opacity: 1;
    color: var(--tq-hot);
    text-shadow: 0 0 10px var(--tq-hot), 0 0 22px rgba(0,255,218,0.55);
  }

  .display-expr {
    font-size: 0.74rem;
    color: var(--tq-dim);
    letter-spacing: 0.05em;
    min-height: 17px;
    text-align: right;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
  }

  /* ── MAIN DISPLAY NUMBER ── */
  .display-main {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.3rem;
    font-weight: 900;
    color: #ffffff;
    text-shadow:
      0 0 6px  #ffffff,
      0 0 14px var(--tq-hot),
      0 0 32px rgba(0,245,200,0.65),
      0 0 60px rgba(0,200,170,0.30);
    letter-spacing: 0.06em;
    line-height: 1.1;
    transition: font-size 0.15s;
    word-break: break-all;
    text-align: right;
    max-width: 100%;
    animation: flicker 7s infinite;
  }
  .display-main.small  { font-size: 1.5rem; }
  .display-main.xsmall { font-size: 1.1rem; }

  /* ══════════════════════════════════════════
     BUTTON GRID
  ══════════════════════════════════════════ */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    position: relative;
    z-index: 2;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(0,245,200,0.045) 0%, transparent 60%),
      linear-gradient(160deg, rgba(238,252,248,0.60) 0%, rgba(243,254,251,0.45) 100%);
    border-radius: 12px;
    padding: 8px;
    box-shadow:
      inset 0 2px 10px rgba(0,0,0,0.08),
      inset 0 0 0 1px rgba(0,200,170,0.12);
  }

  /* ── BASE BUTTON ── */
  button {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.83rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #ffffff;
    background: linear-gradient(160deg,
      rgba(0, 42, 48, 0.96) 0%,
      rgba(0, 28, 34, 0.98) 100%);
    border: 1px solid rgba(0,245,200,0.28);
    border-radius: 9px;
    padding: 0;
    height: 53px;
    cursor: pointer;
    transition: all 0.11s ease;
    position: relative;
    overflow: hidden;
    text-shadow:
      0 0 5px rgba(255,255,255,0.95),
      0 0 12px rgba(0,245,200,0.70),
      0 0 24px rgba(0,245,200,0.35);
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
    /* shiny top-edge highlight */
    box-shadow:
      inset 0 1px 0 rgba(0,255,218,0.28),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }

  /* hover shimmer overlay */
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%,
      rgba(0,255,218,0.22) 0%,
      rgba(0,245,200,0.08) 40%,
      transparent 70%);
    opacity: 0;
    transition: opacity 0.13s;
  }

  button:hover {
    background: linear-gradient(160deg,
      rgba(0, 65, 70, 0.96) 0%,
      rgba(0, 45, 52, 0.98) 100%);
    border-color: var(--tq);
    box-shadow:
      inset 0 1px 0 rgba(0,255,218,0.50),
      0 0 20px rgba(0,245,200,0.35),
      0 0 40px rgba(0,245,200,0.12);
    transform: translateY(-2px);
  }
  button:hover::after { opacity: 1; }

  button:active {
    transform: translateY(0) scale(0.96);
    background: rgba(0,245,200,0.18);
    box-shadow:
      inset 0 0 20px rgba(0,245,200,0.25),
      0 0 28px rgba(0,245,200,0.45);
  }

  /* ── SPECIAL / FUNCTION BUTTONS ── */
  button.special {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    background: linear-gradient(160deg,
      rgba(0, 55, 58, 0.97) 0%,
      rgba(0, 38, 42, 0.98) 100%);
    border-color: rgba(0,245,200,0.32);
    text-shadow:
      0 0 5px rgba(255,255,255,0.9),
      0 0 12px rgba(0,245,200,0.65),
      0 0 22px rgba(0,245,200,0.30);
    box-shadow:
      inset 0 1px 0 rgba(0,255,218,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }

  /* ── OPERATOR BUTTONS ── */
  button.operator {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.18rem;
    font-weight: 900;
    background: linear-gradient(160deg,
      rgba(0, 80, 78, 0.98) 0%,
      rgba(0, 58, 56, 0.99) 100%);
    border-color: rgba(0,245,200,0.45);
    text-shadow:
      0 0 6px rgba(255,255,255,1.0),
      0 0 16px rgba(0,245,200,0.80),
      0 0 30px rgba(0,245,200,0.40);
    box-shadow:
      inset 0 1px 0 rgba(0,255,218,0.38),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 0 12px rgba(0,245,200,0.15);
  }

  /* ── EQUALS BUTTON ── */
  button.equals {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.28rem;
    font-weight: 900;
    background: linear-gradient(160deg, #00F5C8 0%, #00C9A7 100%);
    color: #001C18;
    grid-column: span 2;
    border-color: var(--tq-hot);
    text-shadow: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -2px 0 rgba(0,0,0,0.25),
      0 0 24px rgba(0,245,200,0.55),
      0 0 55px rgba(0,245,200,0.22),
      0 0 90px rgba(0,200,170,0.10);
    transition: all 0.11s ease;
  }
  button.equals:hover {
    background: linear-gradient(160deg, #00FFD8 0%, #00DDB8 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      0 0 36px rgba(0,255,218,0.70),
      0 0 80px rgba(0,245,200,0.30);
    transform: translateY(-2px);
    color: #000E0E;
  }
  button.equals:active {
    transform: translateY(0) scale(0.96);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.3),
      0 0 40px rgba(0,255,218,0.60);
  }

  /* ── CLEAR / BACKSPACE BUTTONS ── */
  button.clear {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    color: #ff5c5c;
    border-color: rgba(255,70,70,0.38);
    text-shadow:
      0 0 5px rgba(255,90,90,0.95),
      0 0 14px rgba(255,40,40,0.60),
      0 0 28px rgba(255,40,40,0.28);
    box-shadow:
      inset 0 1px 0 rgba(255,120,120,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }
  button.clear:hover {
    background: rgba(255,40,40,0.14);
    border-color: #ff5c5c;
    box-shadow:
      inset 0 1px 0 rgba(255,120,120,0.25),
      0 0 20px rgba(255,40,40,0.32);
    color: #ff7070;
  }

  /* ── SHIFT BUTTON ── */
  button.shift-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    background: linear-gradient(160deg,
      rgba(0, 55, 68, 0.97) 0%,
      rgba(0, 38, 48, 0.98) 100%);
    border-color: rgba(0,245,200,0.45);
    box-shadow:
      inset 0 1px 0 rgba(0,255,218,0.28),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }
  button.shift-btn.active {
    background: linear-gradient(160deg,
      rgba(0,245,200,0.28) 0%,
      rgba(0,200,170,0.20) 100%);
    border-color: var(--tq-hot);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.30),
      0 0 22px rgba(0,255,218,0.55),
      0 0 50px rgba(0,245,200,0.22);
    color: var(--tq-hot);
    text-shadow:
      0 0 6px  #ffffff,
      0 0 14px var(--tq-hot),
      0 0 28px rgba(0,255,218,0.65);
  }

  /* ── SUB LABELS ── */
  .sub-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.48rem;
    font-weight: 400;
    color: rgba(0,160,140,0.70);
    letter-spacing: 0.03em;
    line-height: 1;
    text-shadow: none;
  }

  /* ══════════════════════════════════════════
     ANIMATIONS
  ══════════════════════════════════════════ */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60%  { transform: translateX(-7px); }
    40%,80%  { transform: translateX(7px); }
  }
  .shake { animation: shake 0.4s ease; }

  @keyframes flicker {
    0%,100%   { opacity: 1; }
    91%       { opacity: 1; }
    92%       { opacity: 0.62; }
    93%       { opacity: 1; }
    96%       { opacity: 0.80; }
    97%       { opacity: 1; }
  }

  /* ── pulsing glow ring around the whole calc ── */
  @keyframes pulse-ring {
    0%,100% { box-shadow:
      inset 0 1px 0   rgba(0,255,218,0.45),
      inset 0 -1px 0  rgba(0,245,200,0.12),
      0 0 0 1px       rgba(0,245,200,0.20),
      0 0 30px        rgba(0,245,200,0.30),
      0 0 80px        rgba(0,200,170,0.18),
      0 0 140px       rgba(0,0,0,0.92); }
    50%     { box-shadow:
      inset 0 1px 0   rgba(0,255,218,0.60),
      inset 0 -1px 0  rgba(0,245,200,0.18),
      0 0 0 1px       rgba(0,245,200,0.35),
      0 0 45px        rgba(0,245,200,0.45),
      0 0 100px       rgba(0,200,170,0.28),
      0 0 160px       rgba(0,0,0,0.90); }
  }
  .calculator { animation: pulse-ring 4s ease-in-out infinite; }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="calc-wrapper">
  <div class="calc-title">▸ MATRIX CALC ◂</div>

  <div class="calculator">
    <div class="display" id="display">
      <span class="display-mode"  id="mode-label">DEG</span>
      <span class="display-shift" id="shift-label">SHIFT</span>
      <div class="display-expr"   id="expr-display"></div>
      <div class="display-main"   id="main-display">0</div>
    </div>

    <div class="btn-grid">
      <!-- Row 1 -->
      <button class="shift-btn" id="shift-btn" onclick="toggleShift()">SHIFT<span class="sub-label">2nd</span></button>
      <button class="special"   onclick="toggleAngleMode()"><span id="angle-mode-label">DEG</span><span class="sub-label">RAD</span></button>
      <button class="special"   onclick="insertConst('PI')">π<span class="sub-label">3.14159</span></button>
      <button class="special"   onclick="insertConst('E')">e<span class="sub-label">2.71828</span></button>
      <button class="clear"     onclick="clearAll()">AC</button>

      <!-- Row 2 -->
      <button class="special" onclick="applyFunc('sin')">sin<span class="sub-label">sin⁻¹</span></button>
      <button class="special" onclick="applyFunc('cos')">cos<span class="sub-label">cos⁻¹</span></button>
      <button class="special" onclick="applyFunc('tan')">tan<span class="sub-label">tan⁻¹</span></button>
      <button class="special" onclick="applyFunc('log')">log<span class="sub-label">10^x</span></button>
      <button class="special" onclick="applyFunc('ln')">ln<span class="sub-label">e^x</span></button>

      <!-- Row 3 -->
      <button class="special" onclick="applyFunc('sqrt')">√x<span class="sub-label">x²</span></button>
      <button class="special" onclick="applyFunc('cbrt')">∛x<span class="sub-label">x³</span></button>
      <button class="special" onclick="appendOp('^')">xʸ<span class="sub-label">y√x</span></button>
      <button class="special" onclick="applyFunc('abs')">|x|<span class="sub-label">n!</span></button>
      <button class="special" onclick="applyFunc('1/x')">1/x<span class="sub-label">x%</span></button>

      <!-- Row 4 -->
      <button class="special" onclick="appendChar('(')">(<span class="sub-label">STO</span></button>
      <button class="special" onclick="appendChar(')')">)<span class="sub-label">RCL</span></button>
      <button class="special" onclick="memoryOp('MS')">MS<span class="sub-label">M+</span></button>
      <button class="special" onclick="memoryOp('MR')">MR<span class="sub-label">MC</span></button>
      <button class="clear"   onclick="deleteLast()">⌫</button>

      <!-- Row 5 -->
      <button onclick="appendChar('7')">7</button>
      <button onclick="appendChar('8')">8</button>
      <button onclick="appendChar('9')">9</button>
      <button class="operator" onclick="appendOp('×')">×</button>
      <button class="operator" onclick="appendOp('÷')">÷</button>

      <!-- Row 6 -->
      <button onclick="appendChar('4')">4</button>
      <button onclick="appendChar('5')">5</button>
      <button onclick="appendChar('6')">6</button>
      <button class="operator" onclick="appendOp('+')">+</button>
      <button class="operator" onclick="appendOp('−')">−</button>

      <!-- Row 7 -->
      <button onclick="appendChar('1')">1</button>
      <button onclick="appendChar('2')">2</button>
      <button onclick="appendChar('3')">3</button>
      <button class="special" onclick="applyFunc('floor')">⌊x⌋<span class="sub-label">⌈x⌉</span></button>
      <button class="special" onclick="applyFunc('exp10')">10^x<span class="sub-label">e^x</span></button>

      <!-- Row 8 -->
      <button onclick="appendChar('0')">0</button>
      <button onclick="appendChar('.')">.</button>
      <button class="special" onclick="negate()">+/−</button>
      <button class="equals"  onclick="calculate()">=</button>
    </div>
  </div>

  <div class="footer-text">SCI-CALC v2.0 ∙ MATRIX EDITION — TURQUOISE</div>
</div>

<script>
/* ══════════════════════════════════════════
   MATRIX RAIN — vivid electric green
══════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('matrix-canvas');
  const ctx    = canvas.getContext('2d');
  let cols, drops, fontSize;
  const chars = '0123456789アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン+-×÷=∑∫√πΩΔ';

  function init() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    fontSize = 15;
    cols  = Math.floor(canvas.width / fontSize);
    drops = Array.from({ length: cols }, () => Math.random() * -120);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,4,0,0.052)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < drops.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const y    = drops[i] * fontSize;
      const b    = Math.random();
      ctx.shadowBlur = 0;
      if      (b > 0.97) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 18; ctx.shadowColor = '#00ff41'; }
      else if (b > 0.88) { ctx.fillStyle = '#00ff41'; ctx.shadowBlur =  9; ctx.shadowColor = '#00ff41'; }
      else if (b > 0.60) { ctx.fillStyle = '#00cc33'; }
      else               { ctx.fillStyle = '#007a20'; }
      ctx.font = `bold ${fontSize}px 'Share Tech Mono', monospace`;
      ctx.fillText(char, i * fontSize, y);
      ctx.shadowBlur = 0;
      if (y > canvas.height && Math.random() > 0.974) drops[i] = 0;
      drops[i] += 0.52;
    }
  }

  init();
  setInterval(draw, 38);
  window.addEventListener('resize', init);
})();

/* ══════════════════════════════════════════
   CALCULATOR ENGINE
══════════════════════════════════════════ */
let expression = '', lastResult = null, shiftActive = false,
    angleMode  = 'DEG', memory = 0, justCalculated = false;

const mainDisplay  = document.getElementById('main-display');
const exprDisplay  = document.getElementById('expr-display');
const shiftLabel   = document.getElementById('shift-label');
const modeLabel    = document.getElementById('mode-label');
const angleModeBtn = document.getElementById('angle-mode-label');
const shiftBtn     = document.getElementById('shift-btn');

function updateDisplay(value) {
  const str = String(value);
  mainDisplay.className = 'display-main';
  if (str.length > 14) mainDisplay.classList.add('xsmall');
  else if (str.length > 10) mainDisplay.classList.add('small');
  mainDisplay.textContent = str || '0';
  exprDisplay.textContent = expression;
}

function toggleShift() {
  shiftActive = !shiftActive;
  shiftLabel.classList.toggle('active', shiftActive);
  shiftBtn.classList.toggle('active', shiftActive);
}

function toggleAngleMode() {
  angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
  modeLabel.textContent = angleModeBtn.textContent = angleMode;
}

function toRad(x)   { return angleMode === 'DEG' ? x * Math.PI / 180 : x; }
function fromRad(x) { return angleMode === 'DEG' ? x * 180 / Math.PI : x; }

function appendChar(ch) {
  if (justCalculated && !isNaN(ch) && ch !== '.') { expression = ''; justCalculated = false; }
  else if (justCalculated) justCalculated = false;
  expression += ch; updateDisplay(expression);
}

function appendOp(op) {
  justCalculated = false;
  if (!expression && lastResult !== null) expression = String(lastResult);
  expression += op; updateDisplay(expression);
}

function insertConst(c) {
  justCalculated = false;
  expression += (c === 'PI' ? 'π' : 'e');
  updateDisplay(expression);
}

function negate() {
  if (!expression || expression === '0') return;
  expression = expression.startsWith('−') ? expression.slice(1) : '−' + expression;
  updateDisplay(expression);
}

function deleteLast() {
  justCalculated = false;
  expression = expression.slice(0, -1);
  updateDisplay(expression || '0');
}

function clearAll() {
  expression = ''; lastResult = null; justCalculated = false;
  updateDisplay('0'); exprDisplay.textContent = '';
}

function factorial(n) {
  n = Math.floor(n); if (n < 0) return NaN;
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}

function applyFunc(fn) {
  if (shiftActive) {
    const s = { sin:'asin', cos:'acos', tan:'atan', log:'pow10', ln:'exp',
                sqrt:'sq', cbrt:'cube', abs:'fact', '1/x':'pct', floor:'ceil' };
    fn = s[fn] || fn; toggleShift();
  }
  const val = parseFloat(expression) || lastResult || 0;
  let result;
  switch(fn) {
    case 'sin':   result = Math.sin(toRad(val));    break;
    case 'cos':   result = Math.cos(toRad(val));    break;
    case 'tan':   result = Math.tan(toRad(val));    break;
    case 'asin':  result = fromRad(Math.asin(val)); break;
    case 'acos':  result = fromRad(Math.acos(val)); break;
    case 'atan':  result = fromRad(Math.atan(val)); break;
    case 'log':   result = Math.log10(val);         break;
    case 'ln':    result = Math.log(val);           break;
    case 'pow10': result = Math.pow(10, val);       break;
    case 'exp':   result = Math.exp(val);           break;
    case 'sqrt':  result = Math.sqrt(val);          break;
    case 'cbrt':  result = Math.cbrt(val);          break;
    case 'sq':    result = val * val;               break;
    case 'cube':  result = val * val * val;         break;
    case 'abs':   result = Math.abs(val);           break;
    case 'fact':  result = factorial(val);          break;
    case '1/x':   result = 1 / val;                break;
    case 'pct':   result = val / 100;              break;
    case 'floor': result = Math.floor(val);         break;
    case 'ceil':  result = Math.ceil(val);          break;
    case 'exp10': result = Math.pow(10, val);       break;
    default:      result = val;
  }
  result = +result.toPrecision(12);
  exprDisplay.textContent = `${fn}(${val}) =`;
  expression = String(result); lastResult = result; justCalculated = true;
  updateDisplay(result);
}

function memoryOp(op) {
  if (shiftActive) {
    const s = { MS:'Madd', MR:'MC' }; op = s[op] || op; toggleShift();
  }
  const val = parseFloat(expression) || lastResult || 0;
  switch(op) {
    case 'MS':   memory = val;     showFlash('M SAVED');       break;
    case 'MR':   expression = String(memory); updateDisplay(memory); break;
    case 'MC':   memory = 0;       showFlash('M CLEARED');     break;
    case 'Madd': memory += val;    showFlash('M+ = ' + memory);break;
  }
}

function showFlash(msg) {
  const old = exprDisplay.textContent;
  exprDisplay.textContent = '▸ ' + msg + ' ◂';
  setTimeout(() => { exprDisplay.textContent = old; }, 1300);
}

function parseExpr(e) {
  return e.replace(/π/g,'(Math.PI)').replace(/\be\b/g,'(Math.E)')
          .replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**')
          .replace(/(\d)([\(π])/g,'$1*$2').replace(/([\)π])(\d)/g,'$1*$2')
          .replace(/([\)])([\(])/g,'$1*$2');
}

function calculate() {
  if (!expression) return;
  exprDisplay.textContent = expression + ' =';
  try {
    let r = Function('"use strict"; return (' + parseExpr(expression) + ')')();
    if (!isFinite(r)) throw new Error('∞');
    if (isNaN(r))     throw new Error('NaN');
    r = +r.toPrecision(12);
    lastResult = r; expression = String(r); justCalculated = true;
    updateDisplay(r);
  } catch(e) {
    const msg = (e.message==='∞'||e.message==='NaN') ? e.message : 'ERROR';
    mainDisplay.textContent = msg;
    mainDisplay.classList.add('shake');
    mainDisplay.style.color      = '#ff5c5c';
    mainDisplay.style.textShadow = '0 0 12px rgba(255,60,60,0.9)';
    setTimeout(() => {
      mainDisplay.classList.remove('shake');
      mainDisplay.style.color = mainDisplay.style.textShadow = '';
      expression = ''; updateDisplay('0');
    }, 1300);
  }
}

document.addEventListener('keydown', e => {
  if (e.key>='0'&&e.key<='9') appendChar(e.key);
  else if(e.key==='.') appendChar('.');
  else if(e.key==='+') appendOp('+');
  else if(e.key==='-') appendOp('−');
  else if(e.key==='*') appendOp('×');
  else if(e.key==='/'){e.preventDefault();appendOp('÷');}
  else if(e.key==='^') appendOp('^');
  else if(e.key==='(') appendChar('(');
  else if(e.key===')') appendChar(')');
  else if(e.key==='Enter'||e.key==='=') calculate();
  else if(e.key==='Backspace') deleteLast();
  else if(e.key==='Escape') clearAll();
  else if(e.key==='s') applyFunc('sin');
  else if(e.key==='c') applyFunc('cos');
  else if(e.key==='t') applyFunc('tan');
  else if(e.key==='l') applyFunc('log');
  else if(e.key==='r') applyFunc('sqrt');
});
</script>
